<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Bootstrap Form Styling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
<nav class="navbar navbar-light bg-light border-bottom" aria-label="Tasks">
  <div class="container"><a class="navbar-brand" href="index.html">Assignment 4</a><div class="nav"><a class="nav-link" href="index.html">Task 0</a>
<a class="nav-link" href="task1.html">Task 1</a>
<a class="nav-link active" href="task2.html" aria-current="page">Task 2</a>
<a class="nav-link" href="task3.html">Task 3</a>
<a class="nav-link" href="task4.html">Task 4</a></div></div>
</nav>
<main class="container my-4">
  <h1 class="h3">Task 2. Bootstrap Form Styling</h1>
  <p>Contact form with Bootstrap grid and helper text.</p>
  <form class="row g-3">
<div class="col-md-6">
<label for="name" class="form-label">Name</label>
<input type="text" id="name" name="name" class="form-control" required maxlength="100" placeholder="Your name">
</div>
<div class="col-md-6">
<label for="email" class="form-label">Email</label>
<input type="email" id="email" name="email" class="form-control" required maxlength="100" placeholder="name@example.com">
</div>
<div class="col-12">
<label for="message" class="form-label">Message</label>
<textarea id="message" name="message" rows="4" class="form-control" aria-describedby="message-help" required maxlength="500" placeholder="Your message"></textarea>
<div id="message-help" class="form-text">Up to 500 characters.</div>
</div>
<div class="col-12"><button type="submit" class="btn btn-primary">Submit</button></div>
</form>
<p id="result" class="mt-3" role="status" aria-live="polite"></p>
</main>
</body>
</html>
